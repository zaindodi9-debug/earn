<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Flip Match · EarnGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif}
  body{
    background:radial-gradient(ellipse at 20% 10%, #2e0a4a 0%, #1a0838 50%, #0a0420 100%);
    color:#fff;
  }
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
  .header{width:100%;max-width:560px;text-align:center;margin-bottom:8px}
  .brand{font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;letter-spacing:3px;color:#a5d8ff;opacity:.8;text-transform:uppercase}

  /* HUD */
  #hud{width:100%;max-width:560px;display:flex;justify-content:space-between;gap:8px;margin:10px 0 14px}
  .hud-card{flex:1;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 6px;text-align:center}
  .hud-card .lab{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:1.4px;text-transform:uppercase}
  .hud-card .val{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;margin-top:2px;color:#fff}
  .hud-card.highlight .val{color:#ffd23f}

  /* Grid */
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:460px;aspect-ratio:4/3}
  .card{position:relative;cursor:pointer;aspect-ratio:1;perspective:600px}
  .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,1.3,.5,1)}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card.matched .card-inner{transform:rotateY(180deg)}
  .card.matched{animation:matchPulse .6s ease}
  @keyframes matchPulse{0%{transform:scale(1)}30%{transform:scale(1.1)}100%{transform:scale(1)}}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,42px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .front{
    background:linear-gradient(135deg,#5b3fd6 0%,#3a2a8a 50%,#5b3fd6 100%);
    border:1px solid rgba(255,255,255,.18);
  }
  .front::after{content:'🎮';font-size:clamp(24px,6vw,38px);opacity:.85;filter:saturate(.7)}
  .back{
    transform:rotateY(180deg);
    background:linear-gradient(135deg,#fff,#ffe9f4);
    color:#2a0a4a;border:1px solid rgba(255,255,255,.4);
  }
  .card.matched .back{background:linear-gradient(135deg,#d4ffea,#a8f0c8);box-shadow:0 0 24px rgba(80,255,160,.45)}

  /* Overlays */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30;
    background:radial-gradient(ellipse at 50% 40%, rgba(80,30,140,.6), rgba(10,4,30,.94));
    backdrop-filter:blur(6px);transition:opacity .35s, transform .35s}
  .overlay.hide{opacity:0;transform:scale(1.05);pointer-events:none}
  .title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(40px,11vw,68px);line-height:1;
    background:linear-gradient(180deg,#fff,#ff9ad8);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(255,120,200,.4)}
  .subtitle{margin-top:10px;font-size:clamp(13px,3.5vw,16px);opacity:.85;max-width:340px;line-height:1.5;font-weight:600}
  .btn{margin-top:26px;cursor:pointer;border:none;outline:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;
    padding:16px 46px;border-radius:50px;color:#2a0a4a;background:linear-gradient(180deg,#f5e1ff,#c89bff);
    box-shadow:0 10px 28px rgba(180,120,255,.5), inset 0 -4px 0 rgba(110,60,180,.3);transition:transform .15s}
  .btn:active{transform:translateY(3px) scale(.98)}
  .breakdown{margin-top:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 22px;min-width:230px}
  .breakdown .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;font-weight:600}
  .breakdown .row .v{font-family:'Fredoka',sans-serif;font-size:18px;color:#ffd23f}
  .breakdown .total{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-weight:600}
  .breakdown .total .v{font-family:'Fredoka',sans-serif;font-size:36px;color:#fff;display:block;margin-top:4px;letter-spacing:1px}
  .badge{margin-top:14px;font-size:14px;font-weight:600;padding:6px 16px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
</style>
</head>
<body>
<div id="stage">
  <div class="header"><div class="brand">EarnGames · Flip Match</div></div>
  <div id="hud" style="display:none">
    <div class="hud-card"><span class="lab">Gerakan</span><span class="val" id="movesV">0</span></div>
    <div class="hud-card"><span class="lab">Waktu</span><span class="val" id="timeV">0s</span></div>
    <div class="hud-card highlight"><span class="lab">Pasangan</span><span class="val" id="pairsV">0/6</span></div>
  </div>
  <div id="grid" style="display:none"></div>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="title">Flip Match</div>
    <div class="subtitle">Cari semua pasangan kartu yang sama! Semakin cepat dan sedikit gerakan, semakin besar poin bonus waktu.</div>
    <button class="btn" id="startBtn">Main</button>
    <div class="badge">🃏 6 pasangan · ⏱️ bonus waktu maks 300</div>
  </div>

  <!-- Win screen -->
  <div class="overlay hide" id="winScreen">
    <div class="title">Menang!</div>
    <div class="breakdown">
      <div class="row"><span>🏆 Pasangan × 100</span><span class="v" id="pairScore">600</span></div>
      <div class="row"><span>⏱️ Bonus Waktu</span><span class="v" id="bonusScore">300</span></div>
      <div class="total">Skor Total<span class="v" id="finalScore">900</span></div>
    </div>
    <button class="btn" id="againBtn">Main Lagi</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const SLUG='flip-match';
  const grid=document.getElementById('grid');
  const hud=document.getElementById('hud');
  const movesV=document.getElementById('movesV');
  const timeV=document.getElementById('timeV');
  const pairsV=document.getElementById('pairsV');
  const startScreen=document.getElementById('startScreen');
  const winScreen=document.getElementById('winScreen');
  const pairScoreEl=document.getElementById('pairScore');
  const bonusScoreEl=document.getElementById('bonusScore');
  const finalScoreEl=document.getElementById('finalScore');
  const startBtn=document.getElementById('startBtn');
  const againBtn=document.getElementById('againBtn');

  const EMOJIS=['🎮','🕹️','🎲','🎯','🎨','🎭'];

  let state='idle';
  let cards=[]; // {idx,emoji,el,flipped,matched}
  let flippedQueue=[]; // currently flipped (max 2)
  let moves=0,pairs=0;
  let startT=0,elapsed=0,timerInt=0;
  let lock=false;

  // audio
  let actx=null;
  function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(actx&&actx.state==='suspended')actx.resume();}
  function beep(freq,dur,type='sine',vol=.12){
    if(!actx)return;
    try{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(vol,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
      o.connect(g);g.connect(actx.destination);
      o.start();o.stop(actx.currentTime+dur);
    }catch(_){}
  }
  function flipSfx(){beep(520,.08,'sine',.08);}
  function matchSfx(){beep(660,.1,'sine',.12);setTimeout(()=>beep(880,.14,'sine',.12),90);}
  function missSfx(){beep(220,.18,'triangle',.08);}
  function winSfx(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sine',.12),i*120));}

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j=(Math.random()*(i+1))|0;
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildGrid(){
    grid.innerHTML='';
    const deck=shuffle([...EMOJIS,...EMOJIS]);
    cards=deck.map((emoji,i)=>{
      const card=document.createElement('div');
      card.className='card';
      card.innerHTML=`<div class="card-inner"><div class="face front"></div><div class="face back">${emoji}</div></div>`;
      card.addEventListener('click',()=>onCardClick(i),{passive:true});
      card.addEventListener('touchstart',e=>{e.preventDefault();onCardClick(i);},{passive:false});
      grid.appendChild(card);
      return {idx:i,emoji,el:card,flipped:false,matched:false};
    });
  }

  function startGame(){
    ensureAudio();
    moves=0;pairs=0;flippedQueue=[];lock=false;
    movesV.textContent='0';timeV.textContent='0s';pairsV.textContent='0/6';
    buildGrid();
    startScreen.classList.add('hide');
    winScreen.classList.add('hide');
    hud.style.display='flex';
    grid.style.display='grid';
    startT=performance.now();elapsed=0;
    clearInterval(timerInt);
    timerInt=setInterval(()=>{
      elapsed=(performance.now()-startT)/1000;
      timeV.textContent=Math.floor(elapsed)+'s';
    },200);
  }

  function onCardClick(i){
    if(state!=='playing')return;
    if(lock)return;
    const c=cards[i];
    if(!c||c.flipped||c.matched)return;
    if(flippedQueue.length>=2)return;

    c.flipped=true;c.el.classList.add('flipped');
    flippedQueue.push(c);
    flipSfx();

    if(flippedQueue.length===2){
      moves++;movesV.textContent=moves;
      checkMatch();
    }
  }

  function checkMatch(){
    const [a,b]=flippedQueue;
    if(a.emoji===b.emoji){
      // match
      setTimeout(()=>{
        a.matched=true;b.matched=true;
        a.el.classList.add('matched');b.el.classList.add('matched');
        pairs++;pairsV.textContent=pairs+'/6';
        matchSfx();
        flippedQueue=[];
        if(pairs===6){win();}
      },280);
    }else{
      // mismatch: flip back after 900ms
      lock=true;
      setTimeout(()=>{
        missSfx();
        a.flipped=false;b.flipped=false;
        a.el.classList.remove('flipped');b.el.classList.remove('flipped');
        flippedQueue=[];
        lock=false;
      },900);
    }
  }

  function win(){
    state='over';
    clearInterval(timerInt);
    const totalTime=Math.floor((performance.now()-startT)/1000);
    // time bonus: max 300, decreases 1 per second
    const bonus=Math.max(0,300-totalTime*1);
    const pairScore=pairs*100;
    const total=pairScore+bonus;
    pairScoreEl.textContent=pairScore;
    bonusScoreEl.textContent=bonus+' (+'+(300-bonus)+'s)';
    finalScoreEl.textContent=total;
    winSfx();
    setTimeout(()=>{
      grid.style.display='none';
      hud.style.display='none';
      winScreen.classList.remove('hide');
      reportScore(total,totalTime);
    },600);
  }

  function reportScore(score,timeSec){
    try{if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'EARNGAMES_GAME_RESULT',game:SLUG,score:Math.max(0,Math.floor(score)),timeSec:Math.max(0,Math.floor(timeSec))},'*');
    }}catch(_){}
  }

  startBtn.addEventListener('click',()=>{state='playing';startGame();});
  againBtn.addEventListener('click',()=>{state='playing';startGame();});
})();
</script>
</body>
</html>
