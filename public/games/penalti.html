<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Penalti Sepak Bola · EarnGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#fff}
  body{background:linear-gradient(180deg,#0a3d0a 0%,#1a6b1a 30%,#2da82d 60%,#3fc23f 100%)}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}

  .header{font-family:'Russo One',sans-serif;font-size:14px;letter-spacing:3px;color:#fff;opacity:.85;text-transform:uppercase;margin-bottom:6px}

  /* HUD */
  #hud{display:flex;gap:8px;width:100%;max-width:560px;margin-bottom:8px}
  .hud-card{flex:1;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 6px;text-align:center}
  .hud-card .lab{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:1.4px;text-transform:uppercase}
  .hud-card .val{display:block;font-family:'Russo One',sans-serif;font-size:20px;margin-top:2px}
  .hud-card.highlight .val{color:#ffd23f}

  /* Pitch + goal area */
  #pitch{position:relative;width:100%;max-width:560px;aspect-ratio:5/4;
    background:
      repeating-linear-gradient(90deg, transparent 0, transparent 40px, rgba(0,0,0,.06) 40px, rgba(0,0,0,.06) 80px),
      linear-gradient(180deg, #1f7f1f 0%, #2da82d 100%);
    border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  /* penalty box lines */
  #pitch::before{content:'';position:absolute;inset:8% 12% 0 12%;border:2px solid rgba(255,255,255,.35);border-bottom:none;pointer-events:none}
  /* penalty spot */
  #pitch::after{content:'';position:absolute;bottom:14%;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none}

  /* Goal frame */
  #goal{position:absolute;top:6%;left:12%;right:12%;height:54%;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 22px, rgba(255,255,255,.22) 22px, rgba(255,255,255,.22) 23px),
      repeating-linear-gradient(90deg, transparent 0, transparent 22px, rgba(255,255,255,.22) 22px, rgba(255,255,255,.22) 23px),
      linear-gradient(180deg, rgba(245,245,255,.08), rgba(245,245,255,.03));
    border:6px solid #fff;border-radius:6px 6px 0 0;box-shadow:0 0 18px rgba(255,255,255,.18) inset;
  }
  /* clickable zones overlay */
  #zones{position:absolute;top:6%;left:12%;right:12%;height:54%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0}
  .zone{cursor:pointer;position:relative;transition:background .2s, transform .1s}
  .zone:hover{background:rgba(255,255,255,.06)}
  .zone:active{transform:scale(.97)}
  .zone.disabled{pointer-events:none;cursor:default}
  .zone.hint::after{content:'🎯';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.35;pointer-events:none}
  .zone.shot-target{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 3px rgba(255,210,63,.5)}
  .zone.saved{background:rgba(255,80,80,.28);box-shadow:inset 0 0 0 3px rgba(255,80,80,.7)}
  .zone.goal{background:rgba(80,255,140,.28);box-shadow:inset 0 0 0 3px rgba(80,255,140,.7)}

  /* Keeper */
  #keeper{position:absolute;left:50%;bottom:6%;width:60px;height:84px;transform:translateX(-50%);
    transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 100%;z-index:6;pointer-events:none}
  .keeper-body{position:absolute;inset:0}
  .keeper-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#f4c896;border:2px solid #2a1a0a}
  .keeper-torso{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:30px;height:38px;background:#ffe680;border:2px solid #2a1a0a;border-radius:6px}
  .keeper-arm-l, .keeper-arm-r{position:absolute;top:24px;width:10px;height:30px;background:#ffe680;border:2px solid #2a1a0a;border-radius:5px;transform-origin:50% 0%;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
  .keeper-arm-l{left:6px}.keeper-arm-r{right:6px}
  .keeper-leg-l, .keeper-leg-r{position:absolute;bottom:0;width:11px;height:22px;background:#1a3d8a;border:2px solid #2a1a0a;border-radius:4px}
  .keeper-leg-l{left:14px}.keeper-leg-r{right:14px}

  /* Ball */
  #ball{position:absolute;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff, #d0d0d0 70%);
    border:1px solid #1a1a1a;z-index:7;pointer-events:none;
    box-shadow:0 4px 8px rgba(0,0,0,.3);
    background-image:
      radial-gradient(circle at 30% 30%, #fff 0%, #fff 25%, #1a1a1a 26%, #1a1a1a 36%, #fff 37%, #fff 50%, #1a1a1a 51%, #1a1a1a 60%, #fff 61%, #fff 100%);
  }
  #ball::before{content:'⚽';position:absolute;inset:-2px;font-size:22px;display:flex;align-items:center;justify-content:center}

  /* Banner (GOAL! / SAVE!) */
  #banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-family:'Russo One',sans-serif;font-size:clamp(40px,12vw,72px);letter-spacing:3px;
    text-shadow:0 6px 20px rgba(0,0,0,.5), 0 0 30px currentColor;z-index:10;
    transition:transform .35s cubic-bezier(.4,1.6,.4,1);pointer-events:none}
  #banner.show{transform:translate(-50%,-50%) scale(1)}
  #banner.goal{color:#80ff90}
  #banner.save{color:#ff8080}

  .result-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-family:'Russo One',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;
    text-shadow:0 4px 12px rgba(0,0,0,.6);z-index:9;transition:transform .3s cubic-bezier(.4,1.6,.4,1);pointer-events:none}
  .result-stamp.show{transform:translate(-50%,-50%) scale(1)}

  /* Round indicator dots */
  #rounds{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);transition:all .25s}
  .dot.goal{background:#80ff90;border-color:#80ff90;box-shadow:0 0 10px rgba(128,255,144,.6)}
  .dot.miss{background:#ff8080;border-color:#ff8080}
  .dot.current{background:#ffd23f;border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.6)}

  /* Overlays */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30;
    background:radial-gradient(ellipse at 50% 40%, rgba(20,80,20,.75), rgba(5,30,5,.94));
    backdrop-filter:blur(6px);transition:opacity .35s, transform .35s}
  .overlay.hide{opacity:0;transform:scale(1.05);pointer-events:none}
  .title{font-family:'Russo One',sans-serif;font-size:clamp(32px,9vw,58px);line-height:1.05;letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(255,210,63,.4)}
  .subtitle{margin-top:10px;font-size:clamp(13px,3.5vw,16px);opacity:.9;max-width:360px;line-height:1.5;font-weight:600}
  .btn{margin-top:24px;cursor:pointer;border:none;outline:none;font-family:'Russo One',sans-serif;font-size:22px;letter-spacing:1px;
    padding:16px 46px;border-radius:50px;color:#1a3d0a;
    background:linear-gradient(180deg,#fff,#d8f8a0);
    box-shadow:0 10px 28px rgba(180,255,100,.5), inset 0 -4px 0 rgba(80,140,30,.3);transition:transform .15s}
  .btn:active{transform:translateY(3px) scale(.98)}
  .score-block{margin-top:16px}
  .score-block .lab{font-size:12px;letter-spacing:2px;opacity:.7;text-transform:uppercase;font-weight:600}
  .score-block .val{font-family:'Russo One',sans-serif;font-size:56px;line-height:1;margin-top:4px;
    background:linear-gradient(180deg,#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{margin-top:10px;font-size:14px;font-weight:600;padding:6px 16px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
</style>
</head>
<body>
<div id="stage">
  <div class="header">⚽ EarnGames · Penalti Sepak Bola</div>

  <div id="hud" style="display:none">
    <div class="hud-card"><span class="lab">Ronde</span><span class="val" id="roundV">1/5</span></div>
    <div class="hud-card highlight"><span class="lab">Gol</span><span class="val" id="goalsV">0</span></div>
    <div class="hud-card"><span class="lab">Skor</span><span class="val" id="scoreV">0</span></div>
  </div>

  <div id="pitch" style="display:none">
    <div id="goal"></div>
    <div id="zones"></div>
    <div id="keeper">
      <div class="keeper-body">
        <div class="keeper-head"></div>
        <div class="keeper-torso"></div>
        <div class="keeper-arm-l"></div>
        <div class="keeper-arm-r"></div>
        <div class="keeper-leg-l"></div>
        <div class="keeper-leg-r"></div>
      </div>
    </div>
    <div id="ball"></div>
    <div id="banner"></div>
  </div>
  <div id="rounds" style="display:none"></div>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="title">PENALTI<br>SEPAK BOLA</div>
    <div class="subtitle">Ketuk sudut gawang untuk menembak. Tipu kiper! 5 ronde — setiap gol +100 poin.</div>
    <button class="btn" id="startBtn">Main</button>
    <div class="badge">⚽ 5 ronde · 🥅 +100 / gol</div>
  </div>

  <!-- Result screen -->
  <div class="overlay hide" id="resultScreen">
    <div class="title" id="resultTitle">Selesai!</div>
    <div class="score-block">
      <div class="lab">Gol · Skor</div>
      <div class="val"><span id="goalsFinal">0</span>/5 · <span id="finalScore">0</span></div>
    </div>
    <div class="badge" id="resultBadge">Hebat!</div>
    <button class="btn" id="againBtn">Main Lagi</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const SLUG='penalti';
  const pitch=document.getElementById('pitch');
  const zonesWrap=document.getElementById('zones');
  const keeper=document.getElementById('keeper');
  const ball=document.getElementById('ball');
  const banner=document.getElementById('banner');
  const hud=document.getElementById('hud');
  const roundsWrap=document.getElementById('rounds');
  const roundV=document.getElementById('roundV');
  const goalsV=document.getElementById('goalsV');
  const scoreV=document.getElementById('scoreV');
  const startScreen=document.getElementById('startScreen');
  const resultScreen=document.getElementById('resultScreen');
  const resultTitle=document.getElementById('resultTitle');
  const resultBadge=document.getElementById('resultBadge');
  const goalsFinal=document.getElementById('goalsFinal');
  const finalScoreEl=document.getElementById('finalScore');
  const startBtn=document.getElementById('startBtn');
  const againBtn=document.getElementById('againBtn');

  // build 9 zones
  const zoneEls=[];
  for(let i=0;i<9;i++){
    const z=document.createElement('div');
    z.className='zone hint';
    z.addEventListener('click',()=>shoot(i),{passive:true});
    z.addEventListener('touchstart',e=>{e.preventDefault();shoot(i);},{passive:false});
    zonesWrap.appendChild(z);
    zoneEls.push(z);
  }

  // audio
  let actx=null;
  function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(actx&&actx.state==='suspended')actx.resume();}
  function beep(freq,dur,type='sine',vol=.14){
    if(!actx)return;
    try{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(vol,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
      o.connect(g);g.connect(actx.destination);
      o.start();o.stop(actx.currentTime+dur);
    }catch(_){}
  }
  function kickSfx(){beep(220,.08,'square',.18);setTimeout(()=>beep(120,.1,'sine',.12),40);}
  function goalSfx(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.14),i*90));}
  function saveSfx(){beep(180,.2,'sawtooth',.12);setTimeout(()=>beep(120,.25,'sawtooth',.1),100);}
  function endSfx(){[392,523,659,784,1047,1318].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sine',.14),i*110));}

  let state='idle';
  let round=0,goals=0,score=0;
  let shooting=false;
  let startT=0;
  const TOTAL_ROUNDS=5;

  function reset(){
    round=0;goals=0;score=0;shooting=false;
    roundV.textContent='1/'+TOTAL_ROUNDS;
    goalsV.textContent='0';scoreV.textContent='0';
    resetKeeper();
    resetBall();
    zoneEls.forEach(z=>{z.className='zone hint';});
    // round dots
    roundsWrap.innerHTML='';
    for(let i=0;i<TOTAL_ROUNDS;i++){
      const d=document.createElement('div');
      d.className='dot'+(i===0?' current':'');
      roundsWrap.appendChild(d);
    }
  }

  function resetKeeper(){
    keeper.style.transform='translateX(-50%) translateY(0) rotate(0deg)';
    keeper.style.left='50%';
    keeper.style.top='';
    keeper.style.bottom='6%';
    // reset arms
    keeper.querySelector('.keeper-arm-l').style.transform='rotate(0deg)';
    keeper.querySelector('.keeper-arm-r').style.transform='rotate(0deg)';
  }

  function resetBall(){
    ball.style.transition='none';
    ball.style.left='50%';
    ball.style.top='';
    ball.style.bottom='14%';
    ball.style.transform='translateX(-50%)';
    void ball.offsetWidth;
    ball.style.transition='left .35s cubic-bezier(.3,1.2,.5,1), top .35s cubic-bezier(.3,1.2,.5,1), transform .35s';
  }

  function startGame(){
    ensureAudio();
    reset();
    state='playing';
    startScreen.classList.add('hide');
    resultScreen.classList.add('hide');
    hud.style.display='flex';
    pitch.style.display='block';
    roundsWrap.style.display='flex';
    startT=performance.now();
  }

  function setRoundDots(){
    [...roundsWrap.children].forEach((d,i)=>{
      d.className='dot';
      if(i<round){d.classList.add(goals>i-1?'goal':'miss');}
      else if(i===round){d.classList.add('current');}
    });
  }

  // zone geometry: index 0..8 mapping to (col, row) where col=0,1,2 left→right; row=0,1,2 top→bottom
  function zoneToRect(idx){
    const col=idx%3, row=(idx/3)|0;
    const rect=pitch.getBoundingClientRect();
    const goalRect={top:rect.height*0.06+6, left:rect.width*0.12+6, w:rect.width*0.76-12, h:rect.height*0.54-12};
    const cellW=goalRect.w/3, cellH=goalRect.h/3;
    return {
      cx: goalRect.left + cellW*col + cellW/2,
      cy: goalRect.top + cellH*row + cellH/2,
      col, row
    };
  }

  function shoot(zoneIdx){
    if(state!=='playing'||shooting)return;
    shooting=true;
    zoneEls.forEach(z=>z.classList.add('disabled'));
    const tz=zoneEls[zoneIdx];
    tz.classList.remove('hint');
    tz.classList.add('shot-target');

    // keeper picks random zone (slight bias toward corners + center for realism)
    const keeperBias=[0,2,4,6,8]; // corners + center
    let keeperZone;
    if(Math.random()<0.45){keeperZone=keeperBias[(Math.random()*keeperBias.length)|0];}
    else{keeperZone=(Math.random()*9)|0;}

    const target=zoneToRect(zoneIdx);
    const keeperTarget=zoneToRect(keeperZone);

    // animate ball
    const pitchRect=pitch.getBoundingClientRect();
    const ballStartX=pitchRect.width/2;
    const ballStartY=pitchRect.height*0.86;
    ball.style.left=(target.cx-11)+'px';
    ball.style.top=(target.cy-11)+'px';
    ball.style.transform='translateX(0) scale(.7) rotate(720deg)';
    kickSfx();

    // animate keeper dive (use translate within pitch coords)
    const keeperCenterX = keeperTarget.cx;
    const keeperCenterY = keeperTarget.cy + 14;
    keeper.style.left=(keeperCenterX-30)+'px';
    keeper.style.top=(keeperCenterY-84)+'px';
    keeper.style.bottom='auto';
    keeper.style.transform='translateX(0) ' + (keeperTarget.col===0?'rotate(-25deg)':keeperTarget.col===2?'rotate(25deg)':'rotate(0deg)');
    // arms spread
    keeper.querySelector('.keeper-arm-l').style.transform='rotate('+(keeperTarget.col===0?-50:-30)+'deg)';
    keeper.querySelector('.keeper-arm-r').style.transform='rotate('+(keeperTarget.col===2?50:30)+'deg)';

    const isGoal = zoneIdx !== keeperZone;
    setTimeout(()=>{
      if(isGoal){
        tz.classList.remove('shot-target');
        tz.classList.add('goal');
        goals++;score+=100;
        goalsV.textContent=goals;
        scoreV.textContent=score;
        showBanner('GOL!',true);
        goalSfx();
      }else{
        tz.classList.remove('shot-target');
        tz.classList.add('saved');
        showBanner('TANGKAP!',false);
        saveSfx();
      }
    },380);

    // next round
    setTimeout(()=>{
      hideBanner();
      round++;
      setRoundDots();
      if(round>=TOTAL_ROUNDS){
        endGame();
      }else{
        roundV.textContent=(round+1)+'/'+TOTAL_ROUNDS;
        resetBall();
        resetKeeper();
        zoneEls.forEach(z=>{z.className='zone hint';z.classList.remove('disabled');});
        shooting=false;
      }
    },1500);
  }

  function showBanner(text,isGoal){
    banner.textContent=text;
    banner.className=isGoal?'goal show':'save show';
  }
  function hideBanner(){
    banner.classList.remove('show');
  }

  function endGame(){
    state='over';
    const timeSec=Math.round((performance.now()-startT)/1000);
    setTimeout(()=>{
      hud.style.display='none';
      pitch.style.display='none';
      roundsWrap.style.display='none';
      goalsFinal.textContent=goals;
      finalScoreEl.textContent=score;
      if(goals===5){resultTitle.textContent='Sempurna!';resultBadge.textContent='🏆 Semua gol masuk!';}
      else if(goals>=3){resultTitle.textContent='Selesai!';resultBadge.textContent='👍 Main bagus';}
      else if(goals>=1){resultTitle.textContent='Selesai!';resultBadge.textContent='💪 Tetap semangat';}
      else{resultTitle.textContent='Selesai!';resultBadge.textContent='😅 Coba lagi';}
      resultScreen.classList.remove('hide');
      endSfx();
      reportScore(score,timeSec);
    },700);
  }

  function reportScore(score,timeSec){
    try{if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'EARNGAMES_GAME_RESULT',game:SLUG,score:Math.max(0,Math.floor(score)),timeSec:Math.max(0,Math.floor(timeSec))},'*');
    }}catch(_){}
  }

  startBtn.addEventListener('click',startGame);
  againBtn.addEventListener('click',startGame);

  // reposition ball on resize
  window.addEventListener('resize',()=>{
    if(state==='playing'&&!shooting){resetBall();resetKeeper();}
  });
})();
</script>
</body>
</html>
